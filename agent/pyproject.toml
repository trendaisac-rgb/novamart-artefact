[project]
name = "novamart-assistant"
version = "0.1.0"
description = "NovaMart internal support assistant: grounded agent with tools, evals and a knowledge gap loop"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "rank-bm25>=0.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.159",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
